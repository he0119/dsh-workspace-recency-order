name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # pnpm 版本不在 workflow 里写死：action-setup 读 package.json 的 packageManager，与本地用同一个
      # 版本。它必须排在 setup-node 前面——下面的 cache: pnpm 要靠它算 store 路径。
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          # 与 engines 的下限一致，确保不会无意中依赖更高版本的 Node。
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 类型检查：源文件是 TypeScript，这一步同时覆盖「语法能否解析」与「类型是否自洽」。
      # tsconfig.test.json 把 test/ 与 scripts/ 也算进来，所以测试里的类型错误在这里就会红。
      - run: pnpm run typecheck
      # 构建产物必须真的出得来——tsdown 不做类型检查，所以它与 typecheck 是两件独立的事。
      - run: pnpm run build
      # 打包内容与入口自洽：导出路径是否落地、客户端产物是否还是经典脚本契约、`files` 是否带齐
      # 运行时文件。放在 build 之后，它依赖 lib/ 存在。
      - run: pnpm run check:package
      # 进程内 runner（test/run-all.mjs），不是 `node --test`：后者为每个测试文件起子进程，在受限
      # 环境里会因命名管道不可用而 EPERM。详见 docs/development.md。
      # test/artifact.test.mjs 会加载上面构建出来的 lib/，所以这一步必须排在 build 之后。
      - run: pnpm test
